name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #     - run: pip install ruff mypy
  #     - run: ruff check ml/src/ cli/src/ api/ tests/
  #     - run: ruff format --check ml/src/ cli/src/ api/ tests/

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,train]"
      - run: python -m pytest ml/tests/ cli/tests/ api/tests/ tests/ -v --tb=short
        env:
          PYTHONPATH: ml/src:cli/src

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd web && npm install
      - run: cd web && npm run build

  validate-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pydantic
      - run: python scripts/validate_dataset.py

  docker:
    runs-on: ubuntu-latest
    # needs: [lint, test-python, test-web, validate-dataset]
    needs: [test-python, test-web, validate-dataset]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
