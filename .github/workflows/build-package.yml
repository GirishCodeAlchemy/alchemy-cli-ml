name: Build & Publish Package

on:
  # Auto-trigger on version tags
  push:
    tags:
      - "v*"

  # Manual trigger
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI"
        type: boolean
        default: false
      publish_ghcr:
        description: "Publish Docker image to GHCR"
        type: boolean
        default: false
      build_target:
        description: "What to build"
        type: choice
        options:
          - all
          - python-only
          - docker-only
        default: "all"

env:
  PYTHONPATH: ml/src:cli/src
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Python Package ──────────────────────────────────────
  build-python:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.build_target != 'docker-only' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 30

      - name: Show package info
        run: |
          echo "📦 Built packages:"
          ls -lh dist/
          echo ""
          echo "Package contents:"
          python -m zipfile -l dist/*.whl | head -30

  test-package:
    runs-on: ${{ matrix.os }}
    needs: build-python
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Install from wheel
        run: pip install dist/*.whl

      - name: Verify CLI entry point
        run: |
          alchemyai version
          alchemyai --help

      - name: Verify ML CLI entry point
        run: |
          alchemyai-ml --help

      - name: Smoke test — dataset build
        run: alchemyai-ml dataset

      - name: Smoke test — keyword search
        run: |
          alchemyai --mode keyword "list kubernetes pods" --json

  publish-pypi:
    runs-on: ubuntu-latest
    needs: test-package
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi) }}
    permissions:
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  # ── Docker Image ────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.build_target != 'python-only' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7} \
            python -c "from alchemy_ml.inference import InferenceEngine; e = InferenceEngine(); e.load_commands(); print(f'✓ {e.command_count} commands loaded')"

      - name: Push Docker image
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_ghcr) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Web UI ──────────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.build_target != 'docker-only' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build web UI
        run: cd web && npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 30

  # ── Release ─────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [test-package, build-docker, build-web]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            python-package/*
