name: ML Pipeline

on:
  # Trigger on knowledge base or ML code changes
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - "ml/src/**"
      - "ml/config/**"
      - "ml/data/benchmark.jsonl"
      - "ml/tests/regression.jsonl"

  # Manual trigger
  workflow_dispatch:
    inputs:
      skip_training:
        description: "Skip classifier training (embeddings only)"
        type: boolean
        default: false
      skip_evaluation:
        description: "Skip evaluation"
        type: boolean
        default: false
      model_name:
        description: "Embedding model override (default: all-MiniLM-L6-v2)"
        type: string
        default: "all-MiniLM-L6-v2"

env:
  PYTHONPATH: ml/src:cli/src

jobs:
  validate-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pydantic
      - name: Validate knowledge base YAML
        run: python scripts/validate_dataset.py

  build-dataset:
    runs-on: ubuntu-latest
    needs: validate-dataset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[train]"
      - name: Build training dataset
        run: python -m alchemy_ml.cli dataset
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: ml/data/processed/
          retention-days: 30

  build-embeddings:
    runs-on: ubuntu-latest
    needs: build-dataset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[train]"
      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: dataset
          path: ml/data/processed/
      - name: Build FAISS index
        run: python -m alchemy_ml.cli embeddings
        env:
          ALCHEMYAI_EMBEDDING__MODEL_NAME: ${{ inputs.model_name || 'all-MiniLM-L6-v2' }}
      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: faiss-index
          path: |
            ml/data/processed/command_embeddings.faiss
            ml/data/processed/command_embeddings.faiss.meta.json
          retention-days: 30

  train-classifier:
    runs-on: ubuntu-latest
    needs: build-dataset
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_training }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[train]"
      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: dataset
          path: ml/data/processed/
      - name: Train intent classifier
        run: python -m alchemy_ml.cli train
      - name: Upload classifier artifact
        uses: actions/upload-artifact@v4
        with:
          name: classifier
          path: ml/models/classifier/
          retention-days: 30

  evaluate:
    runs-on: ubuntu-latest
    needs: [build-embeddings, train-classifier]
    if: ${{ always() && needs.build-embeddings.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.skip_evaluation) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[train]"
      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: dataset
          path: ml/data/processed/
      - name: Download FAISS index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: ml/data/processed/
      - name: Download classifier
        uses: actions/download-artifact@v4
        with:
          name: classifier
          path: ml/models/classifier/
        continue-on-error: true
      - name: Run evaluation
        run: python -m alchemy_ml.cli evaluate
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: ml/reports/
          retention-days: 90

  regression-tests:
    runs-on: ubuntu-latest
    needs: [build-embeddings, train-classifier]
    if: ${{ always() && needs.build-embeddings.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[train]"
      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: dataset
          path: ml/data/processed/
      - name: Download FAISS index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: ml/data/processed/
      - name: Download classifier
        uses: actions/download-artifact@v4
        with:
          name: classifier
          path: ml/models/classifier/
        continue-on-error: true
      - name: Run regression tests
        run: python -m alchemy_ml.cli regression

  benchmark:
    runs-on: ubuntu-latest
    needs: [build-embeddings, train-classifier]
    if: ${{ always() && needs.build-embeddings.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[train]"
      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: dataset
          path: ml/data/processed/
      - name: Download FAISS index
        uses: actions/download-artifact@v4
        with:
          name: faiss-index
          path: ml/data/processed/
      - name: Download classifier
        uses: actions/download-artifact@v4
        with:
          name: classifier
          path: ml/models/classifier/
        continue-on-error: true
      - name: Run benchmark
        run: python -m alchemy_ml.cli benchmark
