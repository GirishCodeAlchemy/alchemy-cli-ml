services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/app/ml
      - ./cli:/app/cli
      - ./api:/app/api
      - ./knowledge:/app/knowledge
    environment:
      - ALCHEMYAI_API_HOST=0.0.0.0
      - ALCHEMYAI_API_PORT=8000
    command: uvicorn api.app:app --reload --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
