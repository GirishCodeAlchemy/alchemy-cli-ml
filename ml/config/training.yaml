seed: 42

embedding:
  model_name: "all-MiniLM-L6-v2"
  dimension: 384
  max_seq_length: 256
  batch_size: 64
  normalize: true
  device: "cpu"

classifier:
  model_type: "logistic_regression"
  C: 1.0
  max_iter: 1000
  tfidf_max_features: 10000
  tfidf_ngram_range: [1, 3]
  min_samples_per_class: 3

retrieval:
  top_k: 10
  faiss_index_type: "flat"

ranking:
  semantic_weight: 0.55
  keyword_weight: 0.20
  technology_weight: 0.10
  intent_weight: 0.10
  tag_weight: 0.05

training:
  epochs: 3
  batch_size: 32
  learning_rate: 0.00002
  warmup_ratio: 0.1
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  negative_ratio: 5

confidence_threshold: 0.50
high_confidence: 0.90
medium_confidence: 0.75
