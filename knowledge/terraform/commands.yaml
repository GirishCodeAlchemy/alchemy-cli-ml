- id: terraform-init-basic
  technology: terraform
  category: init
  name: Initialize Terraform Project
  intent: init_project
  command: terraform init
  description: >
    Initializes a Terraform working directory by downloading provider plugins,
    initializing the backend, and installing modules referenced in the configuration.
    This is the first command to run for any new or cloned Terraform project.
