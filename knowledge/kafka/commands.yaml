  documentation:
    url: https://kafka.apache.org/documentation/#quickstart_createtopic
  verified_at: "2026-08-01"

- id: kafka-delete-topic
  technology: kafka
  category: topics
  name: Delete a topic
  intent: delete_topic
  command: kafka-topics.sh --bootstrap-server <broker>:<port> --delete --topic <topic>
  description: >
    Deletes a Kafka topic and all its data. This operation is irreversible.
    The topic and all messages stored in it will be permanently removed.
    Requires delete.topic.enable=true in broker configuration.
  tags:
    - topics
    - delete
    - destructive
  aliases:
    - delete a kafka topic
    - remove a topic
    - drop topic
    - destroy topic
    - delete topic and data
  examples:
    - query: "delete the topic old-events"
    - query: "remove the kafka topic test-data"
    - query: "drop the unused topic"
  risk: dangerous
  documentation:
    url: https://kafka.apache.org/documentation/#basic_ops_modify_topic
  verified_at: "2026-08-01"

- id: kafka-increase-partitions
  technology: kafka
  category: topics
  name: Increase partition count
  intent: increase_partitions
  command: kafka-topics.sh --bootstrap-server <broker>:<port> --alter --topic <topic> --partitions <new_partition_count>
  description: >
    Increases the number of partitions for an existing topic. Note that
    partition count can only be increased, never decreased. Increasing
    partitions may affect message ordering for keys that were previously
    mapped to existing partitions.
  tags:
    - topics
    - partitions
    - alter
    - scaling
  aliases:
    - increase kafka partitions
    - add more partitions
    - scale topic partitions
    - change partition count
    - expand partitions
    - repartition topic
  examples:
    - query: "increase partitions for topic orders to 12"
    - query: "add more partitions to the events topic"
    - query: "scale up the partition count for user-activity"
  risk: warning
  documentation:
    url: https://kafka.apache.org/documentation/#basic_ops_modify_topic
  verified_at: "2026-08-01"

