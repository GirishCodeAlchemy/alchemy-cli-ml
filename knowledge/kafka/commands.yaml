# AlchemyCLI AI - Kafka Commands

- id: kafka-list-topics
  technology: kafka
  category: topics
  name: List all topics
  intent: list_topics
  command: kafka-topics.sh --bootstrap-server <broker>:<port> --list
  description: >
    Lists all available topics in the Kafka cluster. This is a read-only
    operation that returns the names of all topics, including internal topics
    if they exist.
  tags:
    - topics
    - list
    - discovery
  aliases:
    - list all kafka topics
    - show kafka topics
    - get all topics
    - what topics exist
    - display topics in cluster
  examples:
    - query: "list all kafka topics"
    - query: "show me the topics on the broker"
    - query: "what topics are available in the cluster"
  risk: safe
  documentation:
    url: https://kafka.apache.org/documentation/#topicconfigs
  verified_at: "2026-08-01"

- id: kafka-describe-topic
  technology: kafka
  category: topics
  name: Describe a topic
  intent: describe_topic
  command: kafka-topics.sh --bootstrap-server <broker>:<port> --describe --topic <topic>
  description: >
    Describes the details of a specific Kafka topic including partition count,
    replication factor, partition assignments, leader and ISR (in-sync replicas)
    information for each partition.
  tags:
    - topics
    - describe
    - partitions
    - replicas
  aliases:
    - describe kafka topic
    - show topic details
    - get topic info
    - topic partition details
    - inspect topic
    - show topic configuration
  examples:
    - query: "describe the topic my-events"
    - query: "show me details of the orders topic"
    - query: "what are the partitions for topic user-activity"
  risk: safe
  documentation:
    url: https://kafka.apache.org/documentation/#topicconfigs
  verified_at: "2026-08-01"

- id: kafka-create-topic
  technology: kafka
  category: topics
  name: Create a topic
  intent: create_topic
  command: kafka-topics.sh --bootstrap-server <broker>:<port> --create --topic <topic> --partitions <num_partitions> --replication-factor <replication_factor>
  description: >
    Creates a new Kafka topic with the specified number of partitions and
    replication factor. The replication factor cannot exceed the number of
    brokers in the cluster.
  tags:
